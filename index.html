<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0B0C0E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Capital">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>Capital — накопления</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0B0C0E;
            font-family: -apple-system, 'Inter', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            letter-spacing: -0.01em;
        }

        /* ── Таб-бар ── */
        .tab-bar {
            display: flex;
            background: #0B0C0E;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            background: none;
            border: none;
            color: #6B6B74;
            font-size: 0.8rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.15s;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: #D4AF37;
            border-bottom-color: #D4AF37;
        }

        /* ── Страницы ── */
        .page { display: none; padding: 16px; }
        .page.active { display: block; }

        /* ── Карточка ── */
        .card {
            background: #121316;
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 500;
            color: #8E8E92;
            margin-bottom: 0.3rem;
        }
        .value-large {
            font-size: 2rem;
            font-weight: 600;
            color: #FFFFFF;
            line-height: 1.2;
            letter-spacing: -0.02em;
            word-break: break-word;
        }
        .value-negative { color: #D9634D; }
        .value-medium {
            font-size: 1.2rem;
            font-weight: 500;
            color: #FFFFFF;
            word-break: break-word;
        }
        @media (max-width: 450px) {
            .value-large { font-size: 1.6rem; }
            .value-medium { font-size: 1rem; }
        }
        .metrics-grid {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .metric { flex: 1; min-width: 120px; }
        .goal-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .goal-title {
            font-size: 1.35rem;
            font-weight: 500;
            color: #FFFFFF;
            letter-spacing: -0.3px;
            word-break: break-word;
            flex: 1;
        }
        .goal-badge {
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255,255,255,0.04);
            padding: 8px 16px;
            border-radius: 100px;
            color: #CFCFD4;
            cursor: pointer;
            transition: all 0.15s;
            border: 0.5px solid rgba(255,255,255,0.1);
            white-space: nowrap;
        }
        .goal-badge:active { background: rgba(255,255,255,0.12); transform: scale(0.96); }
        .progress-container { margin: 24px 0 20px; }
        .progress-track {
            background: #26272D;
            border-radius: 100px;
            height: 6px;
            overflow: hidden;
        }
        .progress-fill {
            background: #D4AF37;
            width: 0%;
            height: 100%;
            border-radius: 100px;
            transition: width 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.75rem;
            font-weight: 400;
            color: #9A9AA0;
        }
        .form-area { margin: 28px 0 20px; }
        .form-row { display: flex; flex-direction: column; gap: 12px; }
        .field { width: 100%; }
        .field label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #8E8E94;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            background: #1A1B1F;
            border: 1px solid #2A2B30;
            border-radius: 18px;
            padding: 14px 16px;
            font-size: 16px;
            color: #FFFFFF;
            font-family: inherit;
            outline: none;
            transition: border 0.15s, background 0.15s;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        input:focus { border-color: #D4AF37; background: #1F2025; }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }

        /* Кнопки типа */
        .type-buttons { display: flex; gap: 8px; }
        .type-btn {
            flex: 1;
            padding: 13px 10px;
            border-radius: 18px;
            border: 1px solid transparent;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.02em;
        }
        .type-btn-income {
            background: rgba(46,120,70,0.12);
            border-color: rgba(46,120,70,0.2);
            color: #5BAF78;
        }
        .type-btn-income.active {
            background: rgba(46,120,70,0.22);
            border-color: rgba(46,120,70,0.5);
            color: #74C490;
        }
        .type-btn-income:active { transform: scale(0.97); }
        .type-btn-expense {
            background: rgba(180,70,55,0.12);
            border-color: rgba(180,70,55,0.2);
            color: #C4645A;
        }
        .type-btn-expense.active {
            background: rgba(180,70,55,0.22);
            border-color: rgba(180,70,55,0.5);
            color: #D97A70;
        }
        .type-btn-expense:active { transform: scale(0.97); }

        .btn {
            background: #D4AF37;
            border: none;
            border-radius: 28px;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 1rem;
            color: #0B0C0E;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            margin-top: 8px;
            width: 100%;
        }
        .btn:active { background: #E5C252; transform: scale(0.97); }
        .history-section {
            margin-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 20px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .history-actions { display: flex; gap: 8px; }
        .history-toggle, .clear-history-btn {
            background: none;
            border: 0.5px solid #2D2E35;
            color: #B0B0B8;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s;
        }
        .history-toggle:active, .clear-history-btn:active {
            background: rgba(255,255,255,0.05);
            transform: scale(0.96);
        }
        .history-list {
            max-height: 460px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .history-list.hidden { display: none; }
        .transaction-item {
            background: #0F1013;
            border-radius: 20px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 0.5px solid rgba(255,255,255,0.04);
        }
        .transaction-left { flex: 1; padding-right: 10px; }
        .transaction-type {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            margin-bottom: 3px;
        }
        .income-type { color: #2E9B4B; }
        .expense-type { color: #D9634D; }
        .correction-type { color: #6C8EBF; }
        .transaction-note {
            font-size: 0.75rem;
            color: #CACAD2;
            font-weight: 400;
            margin: 3px 0;
            word-break: break-word;
        }
        .transaction-date { font-size: 0.6rem; color: #6F6F78; }
        .transaction-amount {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.2px;
            white-space: nowrap;
        }
        .income-amount { color: #2E9B4B; }
        .expense-amount { color: #D9634D; }
        .correction-amount { color: #6C8EBF; }
        .delete-transaction {
            background: none;
            border: none;
            color: #5A5A64;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 40px;
            transition: 0.1s;
            margin-left: 6px;
            min-width: 36px;
        }
        .delete-transaction:active {
            color: #D4AF37;
            background: rgba(212,175,55,0.1);
            transform: scale(0.94);
        }
        .empty-history {
            text-align: center;
            padding: 28px 16px;
            color: #5E5E68;
            font-size: 0.75rem;
            border: 1px dashed rgba(255,255,255,0.05);
            border-radius: 24px;
        }
        footer {
            font-size: 0.6rem;
            color: #484850;
            text-align: center;
            margin-top: 20px;
            padding-bottom: 6px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #18191E; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #3A3B42; border-radius: 10px; }
        button { cursor: pointer; touch-action: manipulation; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1E1F25;
            border: 0.5px solid rgba(255,255,255,0.1);
            color: #E0E0E6;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 100px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            white-space: nowrap;
            z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── Модалка ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal {
            background: #18191F;
            border-radius: 28px;
            padding: 24px 20px;
            width: 100%;
            max-width: 560px;
            border: 1px solid rgba(255,255,255,0.07);
            transform: translateY(30px);
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
        }
        .modal-overlay.open .modal { transform: translateY(0); }
        .modal-title {
            font-size: 1rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 20px;
        }
        .modal-field { margin-bottom: 14px; }
        .modal-field label {
            display: block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: #8E8E94;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .modal-field input { border-radius: 16px; padding: 13px 15px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn-cancel {
            flex: 1;
            padding: 13px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.08);
            background: none;
            color: #9A9AA0;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: 0.1s;
        }
        .modal-btn-cancel:active { background: rgba(255,255,255,0.05); }
        .modal-btn-save {
            flex: 2;
            padding: 13px;
            border-radius: 22px;
            border: none;
            background: #D4AF37;
            color: #0B0C0E;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: 0.1s;
        }
        .modal-btn-save:active { background: #E5C252; transform: scale(0.97); }

        /* ══════════════════════════════════════
           СТРАНИЦА СТАТИСТИКИ
        ══════════════════════════════════════ */
        .stats-page { max-width: 600px; margin: 0 auto; }

        /* Итоговые плашки */
        .stats-summary {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .summary-chip {
            background: #121316;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 10px 14px;
            flex: 1;
            min-width: 90px;
        }
        .summary-chip .chip-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #6B6B74;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .summary-chip .chip-value {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: -0.2px;
        }
        .chip-positive { color: #4CAF72; }
        .chip-negative { color: #D9634D; }
        .chip-neutral  { color: #FFFFFF; }

        /* Навигация по месяцам */
        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .cal-nav-month {
            font-size: 0.95rem;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: -0.2px;
        }
        .cal-nav-btns { display: flex; gap: 6px; align-items: center; }
        .cal-nav-btn {
            background: #1A1B1F;
            border: 1px solid #2A2B30;
            border-radius: 10px;
            color: #CFCFD4;
            font-size: 1rem;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
        }
        .cal-nav-btn:active { background: #252630; transform: scale(0.95); }
        .cal-today-btn {
            background: #1A1B1F;
            border: 1px solid #2A2B30;
            border-radius: 10px;
            color: #D4AF37;
            font-size: 0.72rem;
            font-weight: 600;
            font-family: inherit;
            padding: 0 12px;
            height: 34px;
            cursor: pointer;
            transition: 0.1s;
        }
        .cal-today-btn:active { background: #252630; transform: scale(0.95); }

        /* Сетка календаря */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .cal-header-cell {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #5A5A64;
            font-weight: 600;
            text-align: center;
            padding: 6px 2px;
        }
        .cal-cell {
            background: #121316;
            border-radius: 10px;
            padding: 6px 5px;
            min-height: 64px;
            border: 1px solid rgba(255,255,255,0.04);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        @media (max-width: 390px) {
            .cal-cell { min-height: 56px; padding: 5px 4px; }
        }
        .cal-cell.empty { background: transparent; border-color: transparent; }
        .cal-cell.has-income { background: rgba(34,100,58,0.18); border-color: rgba(46,120,70,0.2); }
        .cal-cell.has-expense { background: rgba(120,40,30,0.18); border-color: rgba(180,70,55,0.2); }
        .cal-cell.today {
            border-color: #D4AF37 !important;
            box-shadow: 0 0 0 1px rgba(212,175,55,0.2);
        }
        .cal-day-num {
            font-size: 0.72rem;
            font-weight: 700;
            color: #CFCFD4;
            line-height: 1;
        }
        .cal-cell.today .cal-day-num { color: #D4AF37; }
        .cal-amount {
            font-size: 0.58rem;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
        }
        .cal-amount.positive { color: #4CAF72; }
        .cal-amount.negative { color: #E06B5F; }
        .cal-no-data {
            font-size: 0.6rem;
            color: #3A3A44;
            margin-top: auto;
            line-height: 1;
        }
        .cal-ops {
            font-size: 0.55rem;
            color: #5A5A64;
            line-height: 1;
        }
    </style>
</head>
<body>

<!-- Таб-бар -->
<div class="tab-bar">
    <button class="tab-btn active" id="tabMain">Накопления</button>
    <button class="tab-btn" id="tabStats">Статистика</button>
</div>

<!-- ── Страница: Накопления ── -->
<div class="page active" id="pageMain">
<div style="max-width:600px;margin:0 auto;">
    <div class="card">
        <div class="goal-row">
            <div class="goal-title" id="goalNameDisplay">Капитал</div>
            <div class="goal-badge" id="editGoalBtn">редактировать</div>
        </div>
        <div class="metrics-grid">
            <div class="metric">
                <div class="label">Накоплено</div>
                <div class="value-large" id="currentAmountDisplay">0 ₽</div>
            </div>
            <div class="metric">
                <div class="label">Цель</div>
                <div class="value-medium" id="targetAmountDisplay">0 ₽</div>
            </div>
        </div>
        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <span id="percentSpan">0%</span>
                <span>Осталось <span id="remainderSpan">0 ₽</span></span>
            </div>
        </div>
        <div class="form-area">
            <div class="form-row">
                <div class="field">
                    <label>Тип</label>
                    <div class="type-buttons">
                        <button class="type-btn type-btn-income active" id="btnIncome">+ Доход</button>
                        <button class="type-btn type-btn-expense" id="btnExpense">− Расход</button>
                    </div>
                </div>
                <div class="field">
                    <label>Дата</label>
                    <input type="date" id="dateInput">
                </div>
                <div class="field">
                    <label>Сумма</label>
                    <input type="text" id="amountInput" placeholder="0" inputmode="decimal" pattern="[0-9.,]*">
                </div>
                <div class="field">
                    <label>Описание</label>
                    <input type="text" id="noteInput" placeholder="Что это?" enterkeyhint="done">
                </div>
            </div>
        </div>
        <div class="history-section">
            <div class="history-header">
                <span class="label" style="margin-bottom:0;">ЖУРНАЛ</span>
                <div class="history-actions">
                    <button id="clearHistoryBtn" class="clear-history-btn">Очистить</button>
                    <button id="toggleHistoryBtn" class="history-toggle">⌄ Скрыть</button>
                </div>
            </div>
            <div id="historyList" class="history-list">
                <div class="empty-history">Нет записей</div>
            </div>
        </div>
        <footer>LocalStorage • возможен минус • данные сохраняются</footer>
    </div>
</div>
</div>

<!-- ── Страница: Статистика ── -->
<div class="page" id="pageStats">
<div class="stats-page">

    <!-- Сводка -->
    <div class="stats-summary" id="statsSummary"></div>

    <!-- Навигация по месяцам -->
    <div class="cal-nav">
        <div class="cal-nav-month" id="calMonthLabel"></div>
        <div class="cal-nav-btns">
            <button class="cal-nav-btn" id="calPrevBtn">‹</button>
            <button class="cal-nav-btn" id="calNextBtn">›</button>
            <button class="cal-today-btn" id="calTodayBtn">Сегодня</button>
        </div>
    </div>

    <!-- Календарь -->
    <div class="cal-grid" id="calGrid"></div>

</div>
</div>

<!-- Модалка редактирования -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-title">Редактировать цель</div>
        <div class="modal-field">
            <label>Название</label>
            <input type="text" id="modalGoalName" placeholder="Капитал">
        </div>
        <div class="modal-field">
            <label>Целевая сумма (₽)</label>
            <input type="text" id="modalTargetAmount" inputmode="decimal" pattern="[0-9.,]*">
        </div>
        <div class="modal-field">
            <label>Текущий баланс (₽)</label>
            <input type="text" id="modalCurrentAmount" inputmode="decimal" pattern="[0-9.,]*">
        </div>
        <div class="modal-actions">
            <button class="modal-btn-cancel" id="modalCancelBtn">Отмена</button>
            <button class="modal-btn-save" id="modalSaveBtn">Сохранить</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    /* ══ СОСТОЯНИЕ ══ */
    let state = {
        goalName: "Капитал",
        targetAmount: 100000,
        currentAmount: 0,
        transactions: []
    };
    let historyHidden = false;
    let idCounter = Date.now();

    /* Текущий месяц/год для календаря */
    const now = new Date();
    let calYear  = now.getFullYear();
    let calMonth = now.getMonth(); // 0-based

    /* ══ DOM ══ */
    const goalNameDisplay    = document.getElementById('goalNameDisplay');
    const targetAmountDisplay= document.getElementById('targetAmountDisplay');
    const currentAmountDisplay=document.getElementById('currentAmountDisplay');
    const progressFill       = document.getElementById('progressFill');
    const remainderSpan      = document.getElementById('remainderSpan');
    const percentSpan        = document.getElementById('percentSpan');
    const historyContainer   = document.getElementById('historyList');
    const amountInput        = document.getElementById('amountInput');
    const noteInput          = document.getElementById('noteInput');
    const dateInput          = document.getElementById('dateInput');
    const editGoalBtn        = document.getElementById('editGoalBtn');
    const clearHistoryBtn    = document.getElementById('clearHistoryBtn');
    const toggleHistoryBtn   = document.getElementById('toggleHistoryBtn');
    const btnIncome          = document.getElementById('btnIncome');
    const btnExpense         = document.getElementById('btnExpense');
    const modalOverlay       = document.getElementById('modalOverlay');
    const modalGoalName      = document.getElementById('modalGoalName');
    const modalTargetAmount  = document.getElementById('modalTargetAmount');
    const modalCurrentAmount = document.getElementById('modalCurrentAmount');
    const modalCancelBtn     = document.getElementById('modalCancelBtn');
    const modalSaveBtn       = document.getElementById('modalSaveBtn');
    const toastEl            = document.getElementById('toast');
    const tabMain            = document.getElementById('tabMain');
    const tabStats           = document.getElementById('tabStats');
    const pageMain           = document.getElementById('pageMain');
    const pageStats          = document.getElementById('pageStats');
    const statsSummary       = document.getElementById('statsSummary');
    const calGrid            = document.getElementById('calGrid');
    const calMonthLabel      = document.getElementById('calMonthLabel');
    const calPrevBtn         = document.getElementById('calPrevBtn');
    const calNextBtn         = document.getElementById('calNextBtn');
    const calTodayBtn        = document.getElementById('calTodayBtn');

    /* ══ УТИЛИТЫ ══ */
    let toastTimer = null;
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    function genId() { return ++idCounter; }

    function parseAmount(value) {
        if (value === null || value === undefined) return NaN;
        return parseFloat(String(value).trim().replace(/\s/g, '').replace(/,/g, '.'));
    }

    function formatMoney(value) {
        let num = value, sign = '';
        if (num < 0) { sign = '−'; num = Math.abs(num); }
        let rounded = Math.floor(num);
        let formatted = rounded.toLocaleString('ru-RU');
        let frac = num - rounded;
        if (frac > 0.009) {
            let k = Math.round(frac * 100);
            if (k > 0) formatted += '.' + (k < 10 ? '0' + k : k);
        }
        return (sign ? sign + ' ' : '') + formatted + ' ₽';
    }

    function formatMoneyShort(value) {
        const abs = Math.abs(value);
        const sign = value < 0 ? '−' : '+';
        let str;
        if (abs >= 1000000) str = (abs / 1000000).toFixed(1).replace('.', ',') + ' млн';
        else if (abs >= 1000) str = (abs / 1000).toFixed(1).replace('.', ',') + ' тыс';
        else str = Math.round(abs).toLocaleString('ru-RU');
        return sign + ' ' + str + ' ₽';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function getTodayMSK() {
        const utcMs = Date.now() + new Date().getTimezoneOffset() * 60000;
        const msk = new Date(utcMs + 3 * 3600000);
        return `${msk.getFullYear()}-${String(msk.getMonth()+1).padStart(2,'0')}-${String(msk.getDate()).padStart(2,'0')}`;
    }

    function formatMoneyCalendar(value) {
        const abs = Math.abs(value);
        const sign = value < 0 ? '−' : '+';
        let str;
        if (abs >= 1000000) str = (abs / 1000000).toFixed(1).replace('.', ',') + 'М';
        else if (abs >= 1000) str = (abs / 1000).toFixed(1).replace('.', ',') + 'т';
        else str = Math.round(abs).toString();
        return sign + str;
    }

    /* ══ БИЗНЕС-ЛОГИКА ══ */
    function recalcBalance() {
        let bal = 0;
        for (const t of state.transactions) {
            if (t.type === 'income') bal += t.amount;
            else if (t.type === 'expense') bal -= t.amount;
        }
        state.currentAmount = bal;
    }

    function persist() {
        localStorage.setItem('premium_goal_app', JSON.stringify({
            goalName: state.goalName,
            targetAmount: state.targetAmount,
            currentAmount: state.currentAmount,
            transactions: state.transactions
        }));
    }

    function setDefault() {
        state.goalName = "Капитал";
        state.targetAmount = 100000;
        state.transactions = [];
        state.currentAmount = 0;
    }

    function loadFromStorage() {
        const raw = localStorage.getItem('premium_goal_app');
        if (raw) {
            try {
                const d = JSON.parse(raw);
                state.goalName    = d.goalName || "Капитал";
                state.targetAmount= (typeof d.targetAmount === 'number' && d.targetAmount > 0) ? d.targetAmount : 100000;
                state.transactions= Array.isArray(d.transactions) ? d.transactions : [];
                recalcBalance();
            } catch(e) { setDefault(); }
        } else { setDefault(); }
        renderAll();
    }

    function addTransaction(type, amount, note, dateStr) {
        if (isNaN(amount) || amount <= 0) { showToast("Введите сумму больше нуля"); return false; }
        const cleanNote = note.trim() || (type === 'income' ? "Поступление" : "Списание");
        const todayMsk = getTodayMSK();
        const isToday = !dateStr || dateStr === todayMsk;
        let timestamp, dateDisplay;
        if (isToday) {
            timestamp = Date.now();
            dateDisplay = new Date().toLocaleString('ru-RU');
        } else {
            const d = new Date(dateStr + 'T12:00:00');
            timestamp = d.getTime();
            dateDisplay = d.toLocaleDateString('ru-RU');
        }
        state.transactions.unshift({ id: genId(), type, amount, note: cleanNote, date: dateDisplay, timestamp });
        recalcBalance(); persist(); renderAll();
        return true;
    }

    function deleteTransaction(id) {
        state.transactions = state.transactions.filter(t => t.id !== id);
        recalcBalance(); persist(); renderAll();
    }

    function clearAllHistory() {
        if (!confirm("Удалить всю историю? Баланс станет нулевым.")) return;
        state.transactions = []; recalcBalance(); persist(); renderAll();
        showToast("История очищена");
    }

    /* ══ МОДАЛКА ══ */
    function openEditModal() {
        modalGoalName.value     = state.goalName;
        modalTargetAmount.value = String(state.targetAmount).replace('.', ',');
        modalCurrentAmount.value= String(state.currentAmount).replace('.', ',');
        modalOverlay.classList.add('open');
        modalGoalName.focus();
    }
    function closeModal() { modalOverlay.classList.remove('open'); }
    function saveModal() {
        const newName = modalGoalName.value.trim();
        if (newName) state.goalName = newName;
        const newTarget = parseAmount(modalTargetAmount.value);
        if (!isNaN(newTarget) && newTarget > 0) state.targetAmount = newTarget;
        else if (modalTargetAmount.value.trim()) { showToast("Целевая сумма должна быть больше нуля"); return; }
        const newCurrent = parseAmount(modalCurrentAmount.value);
        if (!isNaN(newCurrent)) {
            const diff = newCurrent - state.currentAmount;
            if (Math.abs(diff) > 0.001) {
                const sign = diff > 0 ? 'Корректировка +' : 'Корректировка −';
                state.transactions.unshift({
                    id: genId(), type: diff > 0 ? 'income' : 'expense',
                    amount: Math.abs(diff),
                    note: `${sign} установлен баланс ${formatMoney(newCurrent)}`,
                    date: new Date().toLocaleString() + ' (ред. цели)',
                    timestamp: Date.now()
                });
                state.currentAmount = newCurrent;
            }
        } else if (modalCurrentAmount.value.trim()) { showToast("Введите корректное число"); return; }
        persist(); renderAll(); closeModal(); showToast("Цель обновлена");
    }

    /* ══ РЕНДЕР НАКОПЛЕНИЙ ══ */
    function renderAll() {
        goalNameDisplay.innerText    = state.goalName;
        targetAmountDisplay.innerText= formatMoney(state.targetAmount);
        const cv = state.currentAmount;
        currentAmountDisplay.innerText = formatMoney(cv);
        currentAmountDisplay.classList.toggle('value-negative', cv < 0);

        let percent = 0, remainder = 0;
        if (cv < 0) { percent = 0; remainder = state.targetAmount - cv; }
        else if (cv >= state.targetAmount) { percent = 100; remainder = 0; }
        else { percent = (cv / state.targetAmount) * 100; remainder = state.targetAmount - cv; }

        const pc = Math.min(100, Math.max(0, percent));
        progressFill.style.width = `${pc}%`;
        percentSpan.innerText = `${Math.floor(pc)}%`;
        remainderSpan.innerText = cv < 0
            ? `перерасход ${formatMoney(Math.abs(cv))}`
            : formatMoney(remainder);

        if (!state.transactions.length) {
            historyContainer.innerHTML = `<div class="empty-history">Журнал пуст. Добавьте операцию</div>`;
            toggleHistoryBtn.innerText = historyHidden ? '⌃ Показать' : '⌄ Скрыть';
            return;
        }
        let html = '';
        for (const t of state.transactions) {
            let typeClass = '', amountClass = '', typeText = '', sign = '';
            if (t.type === 'income') { typeClass='income-type'; amountClass='income-amount'; typeText='ДОХОД'; sign='+'; }
            else { typeClass='expense-type'; amountClass='expense-amount'; typeText='РАСХОД'; sign='−'; }
            const isCorr = t.note && (t.note.includes('Корректировка') || t.note.includes('начальная сумма') || t.note.includes('установлен баланс'));
            if (isCorr) { typeClass='correction-type'; amountClass='correction-amount'; typeText='✎ КОРРЕКТИРОВКА'; }
            html += `<div class="transaction-item">
                <div class="transaction-left">
                    <div class="transaction-type ${typeClass}">${typeText}</div>
                    <div class="transaction-note">${escapeHtml(t.note)}</div>
                    <div class="transaction-date">${escapeHtml(t.date)}</div>
                </div>
                <div style="display:flex;align-items:center;">
                    <div class="transaction-amount ${amountClass}">${sign} ${formatMoney(t.amount)}</div>
                    <button class="delete-transaction" data-id="${t.id}" aria-label="Удалить">✕</button>
                </div>
            </div>`;
        }
        historyContainer.innerHTML = html;
        historyContainer.querySelectorAll('.delete-transaction').forEach(btn => {
            btn.addEventListener('click', e => { e.stopPropagation(); deleteTransaction(Number(btn.getAttribute('data-id'))); });
        });
        historyContainer.classList.toggle('hidden', historyHidden);
        toggleHistoryBtn.innerText = historyHidden ? '⌃ Показать' : '⌄ Скрыть';
    }

    /* ══ РЕНДЕР СТАТИСТИКИ ══ */
    const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const MONTHS_RU_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const DAYS_RU = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

    /* Собрать map: "YYYY-MM-DD" → { income, expense, ops } */
    function buildDayMap() {
        const map = {};
        for (const t of state.transactions) {
            if (t.type !== 'income' && t.type !== 'expense') continue;
            // t.date = "DD.MM.YYYY, HH:MM:SS" (toLocaleString ru)
            let key = null;
            const ts = t.timestamp;
            if (ts) {
                const d = new Date(ts);
                const y = d.getFullYear();
                const m = String(d.getMonth()+1).padStart(2,'0');
                const day = String(d.getDate()).padStart(2,'0');
                key = `${y}-${m}-${day}`;
            } else {
                // fallback: парсим t.date
                const match = t.date.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
                if (match) key = `${match[3]}-${match[2].padStart(2,'0')}-${match[1].padStart(2,'0')}`;
            }
            if (!key) continue;
            if (!map[key]) map[key] = { income: 0, expense: 0, ops: 0 };
            if (t.type === 'income') map[key].income += t.amount;
            else map[key].expense += t.amount;
            map[key].ops++;
        }
        return map;
    }

    function calcPeriodNet(dayMap, days) {
        const cutoff = new Date();
        cutoff.setHours(0,0,0,0);
        cutoff.setDate(cutoff.getDate() - (days - 1));
        let net = 0, ops = 0;
        for (const [key, v] of Object.entries(dayMap)) {
            const d = new Date(key);
            if (d >= cutoff) { net += v.income - v.expense; ops += v.ops; }
        }
        return { net, ops };
    }

    function calcMonthNet(dayMap, year, month) {
        let net = 0, ops = 0;
        const prefix = `${year}-${String(month+1).padStart(2,'0')}-`;
        for (const [key, v] of Object.entries(dayMap)) {
            if (key.startsWith(prefix)) { net += v.income - v.expense; ops += v.ops; }
        }
        return { net, ops };
    }

    function renderStats() {
        const dayMap = buildDayMap();

        /* Сводка */
        const p7  = calcPeriodNet(dayMap, 7);
        const p30 = calcPeriodNet(dayMap, 30);
        const pm  = calcMonthNet(dayMap, calYear, calMonth);

        function chipHTML(label, val, ops) {
            const cls = val > 0 ? 'chip-positive' : val < 0 ? 'chip-negative' : 'chip-neutral';
            const sign = val > 0 ? '+' : '';
            return `<div class="summary-chip">
                <div class="chip-label">${label}</div>
                <div class="chip-value ${cls}">${sign}${formatMoney(val)}</div>
            </div>`;
        }
        statsSummary.innerHTML =
            chipHTML('7 дней', p7.net, p7.ops) +
            chipHTML('30 дней', p30.net, p30.ops) +
            chipHTML(MONTHS_RU[calMonth], pm.net, pm.ops);

        /* Заголовок месяца */
        calMonthLabel.textContent = `${MONTHS_RU[calMonth]} ${calYear}`;

        /* Строим календарь */
        const firstDay = new Date(calYear, calMonth, 1);
        // 0=вс → делаем пн=0
        let startDow = firstDay.getDay(); // 0=вс
        startDow = startDow === 0 ? 6 : startDow - 1; // пн=0..вс=6
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

        const todayKey = (() => {
            const n = new Date();
            return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
        })();

        let html = DAYS_RU.map(d => `<div class="cal-header-cell">${d}</div>`).join('');

        // Пустые ячейки перед первым днём
        for (let i = 0; i < startDow; i++) html += `<div class="cal-cell empty"></div>`;

        for (let day = 1; day <= daysInMonth; day++) {
            const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const data = dayMap[key];
            const isToday = key === todayKey;
            const net = data ? data.income - data.expense : null;
            let cellClass = 'cal-cell';
            if (isToday) cellClass += ' today';
            if (data) cellClass += net >= 0 ? ' has-income' : ' has-expense';

            let inner = `<div class="cal-day-num">${day}</div>`;
            if (data) {
                const cls = net >= 0 ? 'positive' : 'negative';
                inner += `<div class="cal-amount ${cls}">${formatMoneyCalendar(net)}</div>`;
                inner += `<div class="cal-ops">${data.ops} оп.</div>`;
            } else {
                inner += `<div class="cal-no-data">—</div>`;
            }
            html += `<div class="${cellClass}">${inner}</div>`;
        }

        // Заполнить конец до кратности 7
        const total = startDow + daysInMonth;
        const tail = total % 7 === 0 ? 0 : 7 - (total % 7);
        for (let i = 0; i < tail; i++) html += `<div class="cal-cell empty"></div>`;

        calGrid.innerHTML = html;
    }

    /* ══ ВКЛАДКИ ══ */
    function switchTab(tab) {
        if (tab === 'main') {
            tabMain.classList.add('active');
            tabStats.classList.remove('active');
            pageMain.classList.add('active');
            pageStats.classList.remove('active');
        } else {
            tabStats.classList.add('active');
            tabMain.classList.remove('active');
            pageStats.classList.add('active');
            pageMain.classList.remove('active');
            renderStats();
        }
    }

    /* ══ ОБРАБОТЧИКИ ══ */
    function handleAddWithType(type) {
        let amount = parseAmount(amountInput.value);
        if (isNaN(amount) || amount <= 0) { showToast("Введите сумму больше нуля"); return; }
        amount = Math.round(amount * 100) / 100;
        const ok = addTransaction(type, amount, noteInput.value, dateInput.value);
        if (ok) {
            amountInput.value = '';
            noteInput.value = '';
            dateInput.value = getTodayMSK();
            amountInput.blur();
            noteInput.blur();
            showToast(type === 'income' ? "Доход добавлен" : "Расход добавлен");
        }
    }

    function toggleHistory() {
        historyHidden = !historyHidden;
        historyContainer.classList.toggle('hidden', historyHidden);
        toggleHistoryBtn.innerText = historyHidden ? '⌃ Показать' : '⌄ Скрыть';
    }

    function bind() {
        editGoalBtn.addEventListener('click', openEditModal);
        clearHistoryBtn.addEventListener('click', clearAllHistory);
        toggleHistoryBtn.addEventListener('click', toggleHistory);
        btnIncome.addEventListener('click', () => handleAddWithType('income'));
        btnExpense.addEventListener('click', () => handleAddWithType('expense'));
        modalCancelBtn.addEventListener('click', closeModal);
        modalSaveBtn.addEventListener('click', saveModal);
        modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
        [amountInput, noteInput].forEach(el => {
            el.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); } });
        });
        tabMain.addEventListener('click', () => switchTab('main'));
        tabStats.addEventListener('click', () => switchTab('stats'));
        calPrevBtn.addEventListener('click', () => {
            calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderStats();
        });
        calNextBtn.addEventListener('click', () => {
            calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderStats();
        });
        calTodayBtn.addEventListener('click', () => {
            const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); renderStats();
        });
    }

    loadFromStorage();
    bind();
    dateInput.value = getTodayMSK();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/capital-pwa/sw.js')
            .then(reg => console.log('SW registered:', reg))
            .catch(err => console.warn('SW error:', err));
    }
</script>
